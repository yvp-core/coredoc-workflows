name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities here; use private vulnerability reporting.
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: 0.11.0
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Host
      options:
        - Codex CLI
        - Codex desktop
        - Claude Code
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the smallest safe steps and expected versus actual behavior.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: macOS version, architecture, host version, and relevant optional integrations.
    validations:
      required: true
